<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻牌動畫原型</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#171524;color:#f7f0e4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#39304c,#171524 70%)}main{text-align:center;padding:30px 20px 115px;max-width:720px;width:100%}.eyebrow{color:#d6b782;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}p{color:#c4bdca;line-height:1.7}.stage{height:360px;display:grid;place-items:center;perspective:1100px}.card{width:195px;height:300px;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1);cursor:grab;touch-action:pan-y;border:0;background:transparent;color:inherit;padding:0}.card.dragging{cursor:grabbing;transition:none!important}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:12px;border:1px solid #d2b27d;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 18px 45px #0006}.back{background:#29203e;outline:1px solid #a88a60;outline-offset:-12px;font-size:70px;color:#d8b780}.front{transform:rotateY(180deg);background:#f4ead7;color:#33243d;gap:12px}.front .star{font-size:82px}.front strong{letter-spacing:.12em}.front small{font-size:14px}.variant-b .card{transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}.variant-b .card.flipped{transform:translateY(-35px) rotateY(180deg) rotate(-3deg)}.variant-c .card{transition:transform .45s ease,opacity .22s}.variant-c .card.flipped{transform:rotateY(180deg) scale(1.04)}.variant-c .stage{background:radial-gradient(circle,#b29a7430,transparent 60%)}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}button.control{border:1px solid #d4bb91;border-radius:999px;background:#e9d5b2;color:#292034;padding:10px 20px;font-weight:700;cursor:pointer}label{color:#ddd2df;font-size:14px}#state{font-size:13px;color:#a9a1b3}.bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#f9f4ed;color:#25202b;border-radius:30px;padding:8px 13px;box-shadow:0 8px 30px #0008;white-space:nowrap}.bar button{border:0;background:#e6ded2;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px}.bar span{min-width:145px;text-align:center;font-size:13px;font-weight:700}.reduced .card{transition:none}@media(prefers-reduced-motion:reduce){.card{transition:none!important}}
</style></head><body><main id="app"><div class="eyebrow">互動原型 · 僅供討論</div><h1>選一個翻牌的節奏</h1><p id="description"></p><div class="stage"><button class="card" id="card" aria-label="翻開或蓋牌"><span class="face back" aria-hidden="true">✦</span><span class="face front"><span class="star">✧</span><strong>THE STAR</strong><small>星星 · 正位</small></span></button></div><div class="controls"><button class="control" id="flip">翻開牌</button><button class="control" id="reset">重新蓋牌</button><label><input type="checkbox" id="reduced"> 關閉動畫</label></div><p id="state" aria-live="polite"></p><p>按住卡牌左右拖動，拖過一定距離便翻牌；也可點擊卡牌或按「翻開牌」。這是示意牌面，並非最終授權素材。</p></main><nav class="bar" aria-label="切換原型"><button id="prev" aria-label="上一款">←</button><span id="variant"></span><button id="next" aria-label="下一款">→</button></nav>
<script>
// Throwaway prototype: compare three flip motions; no actual draw or persistence.
const variants=[['A','穩定翻轉','卡牌原地翻面，節奏平穩。'],['B','抬起翻轉','卡牌上升後翻面，帶一點儀式感。'],['C','快速揭曉','較快翻面並稍微放大，減少等待。']];let index=Math.max(0,variants.findIndex(v=>v[0]===new URLSearchParams(location.search).get('variant')));let open=false;const app=document.querySelector('#app'),card=document.querySelector('#card'),state=document.querySelector('#state'),flip=document.querySelector('#flip'),reduced=document.querySelector('#reduced');function render(){let v=variants[index];app.className='variant-'+v[0].toLowerCase()+(reduced.checked?' reduced':'');card.classList.toggle('flipped',open);document.querySelector('#variant').textContent=v[0]+' · '+v[1];document.querySelector('#description').textContent=v[2];state.textContent='目前：'+(open?'已翻開，星星正位':'牌背朝上')+' · 動畫'+(reduced.checked?'關閉':'開啟');flip.textContent=open?'蓋牌':'翻開牌'}function change(d){index=(index+d+variants.length)%variants.length;open=false;let u=new URL(location.href);u.searchParams.set('variant',variants[index][0]);history.replaceState(null,'',u);render()}let startX=null, dragged=false, suppressClick=false;const threshold=75;card.addEventListener('pointerdown',e=>{if(e.button!==0)return;startX=e.clientX;dragged=false;card.setPointerCapture(e.pointerId);card.classList.add('dragging')});card.addEventListener('pointermove',e=>{if(startX===null)return;const dx=e.clientX-startX;if(Math.abs(dx)>5)dragged=true;const progress=Math.min(Math.abs(dx)/threshold,1);const base=open?180:0;const direction=open?-1:1;card.style.transform=`translateX(${Math.max(-110,Math.min(110,dx))}px) rotateY(${base+direction*progress*70}deg)`});function finish(e,cancelled=false){if(startX===null)return;const dx=e.clientX-startX;const didDrag=dragged;startX=null;card.classList.remove('dragging');card.style.transform='';if(!cancelled&&Math.abs(dx)>=threshold){open=!open;render()}if(didDrag){suppressClick=true;setTimeout(()=>{suppressClick=false},0)}}card.addEventListener('pointerup',e=>finish(e));card.addEventListener('pointercancel',e=>finish(e,true));card.addEventListener('click',()=>{if(suppressClick)return;open=!open;render()});flip.onclick=()=>{open=!open;render()};document.querySelector('#reset').onclick=()=>{open=false;render()};document.querySelector('#prev').onclick=()=>change(-1);document.querySelector('#next').onclick=()=>change(1);reduced.onchange=render;document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)});render();
</script></body></html>
