<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽牌流程原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#171523;color:#f6eddf;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:30px 24px 60px;text-align:center}h1{font-size:30px;margin:5px}small{color:#cdb488;letter-spacing:.1em}p{color:#c8becb;line-height:1.6}button,input{font:inherit}button{cursor:pointer}input{border:1px solid #655774;border-radius:8px;padding:10px 14px;background:#282335;color:white;width:min(400px,90%)}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{background:#2c2639;border:1px solid #75627d;color:#f7ebda;padding:9px 16px;border-radius:30px}.chip.active{background:#e7ce9f;color:#281d2b}.action{background:#e7ce9f;color:#281d2b;border:0;border-radius:30px;padding:11px 23px;font-weight:bold}.action:disabled{opacity:.45}.desk{position:relative;margin:25px auto 0;height:300px;border-radius:24px;background:radial-gradient(ellipse at center,#3b3150,#211b2d 75%);border:1px solid #574965;overflow:hidden;touch-action:none}.slots{display:flex;justify-content:center;align-items:center;gap:18px;height:100%}.slot{width:118px;height:182px;border:1px dashed #ad977f;border-radius:10px;display:grid;place-content:center;color:#c8b79e;font-size:14px}.placed{width:118px;height:182px;background:#2c203c;border:1px solid #cead73;color:#e1c48e;border-radius:10px;font-size:42px;touch-action:none;cursor:grab;position:relative}.placed.open{background:#f3e6ce;color:#392c3b;font-size:16px}.placed small{display:block;font-size:12px;letter-spacing:0;color:inherit;margin-top:12px}.deck{position:relative;height:145px;margin:0 auto;width:min(680px,100%);overflow:visible}.deck button{position:absolute;top:12px;left:50%;width:68px;height:105px;border-radius:7px;background:#2d2340;border:1px solid #c2a371;color:#d6b578;font-size:25px;transform:translateX(calc(-50% + var(--x))) rotate(var(--r));transform-origin:50% 145px;transition:top .18s,filter .18s}.deck button:hover,.deck button:focus-visible{top:-5px;filter:brightness(1.4)}.deck button:disabled{opacity:.25}.notice{font-size:13px}.footer{margin-top:24px}#result{min-height:24px;color:#e8d1a6}.chosen{border-color:#e4c18a;background:#3a304a}.mode{font-size:13px;color:#c3b3c9} @media(max-width:500px){.slot,.placed{width:85px;height:135px}.desk{height:220px}.deck button{width:48px;height:76px}.deck{overflow:hidden}}
</style></head><body><main><small>互動原型 · 示意流程</small><h1>把問題交給牌</h1><p>選一個方向，或直接輸入你的問題。準備好後，選擇牌陣並抽牌。</p><div class="row" id="topics"><button class="chip" data-topic="愛情">愛情</button><button class="chip" data-topic="金錢">金錢</button><button class="chip" data-topic="事業">事業</button><button class="chip" data-topic="生活">生活</button></div><input id="question" placeholder="也可以直接輸入問題（可留空）" aria-label="你的問題"><div class="row"><button class="chip active" data-count="1">單張牌</button><button class="chip" data-count="3">三張牌 · 過去／現在／未來</button></div><button class="action" id="start">開始抽牌</button><section id="reading" hidden><p id="instruction" aria-live="polite"></p><div class="desk"><div class="slots" id="slots"></div></div><p class="mode">點選下方牌背抽牌；抽出的牌可自由拖動。點擊已抽的牌翻面。</p><div class="deck" id="deck" aria-label="選擇牌背"></div><div class="footer"><button class="chip" id="reset">重新開始</button> <button class="action" id="copy" disabled>複製占卜內容</button><p id="result" aria-live="polite"></p></div></section><p class="notice">這是低成本流程示意：牌面與牌組資料均為範例，不代表正式占卜結果。</p></main><script>
let topic='',count=1,drawn=[],flipped=new Set();const topics=document.querySelector('#topics'),question=document.querySelector('#question'),reading=document.querySelector('#reading'),slots=document.querySelector('#slots'),deck=document.querySelector('#deck'),instruction=document.querySelector('#instruction'),copy=document.querySelector('#copy'),result=document.querySelector('#result');const samples=[['星星','正位'],['月亮','逆位'],['太陽','正位'],['力量','正位'],['愚者','逆位'],['女祭司','正位']];topics.onclick=e=>{const b=e.target.closest('[data-topic]');if(!b)return;topic=topic===b.dataset.topic?'':b.dataset.topic;document.querySelectorAll('[data-topic]').forEach(x=>x.classList.toggle('active',x.dataset.topic===topic))};document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=+b.dataset.count;document.querySelectorAll('[data-count]').forEach(x=>x.classList.toggle('active',x===b))});function drawUI(){slots.innerHTML='';const labels=count===1?['你的牌']:['過去','現在','未來'];labels.forEach((label,i)=>{if(i>=drawn.length){let s=document.createElement('div');s.className='slot';s.textContent=label;slots.append(s);return}let b=document.createElement('button');b.className='placed'+(flipped.has(i)?' open':'');b.innerHTML=flipped.has(i)?`<strong>${drawn[i][0]}</strong><small>${label} · ${drawn[i][1]}</small>`:`✦<small>${label} · 點擊翻牌</small>`;b.setAttribute('aria-label',`${label}：${flipped.has(i)?drawn[i].join(' '):'點擊翻牌'}`);let sx,sy,ox=0,oy=0,px=0,py=0,moved=false,suppress=false;b.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;ox=px;oy=py;moved=false;b.setPointerCapture(e.pointerId)};b.onpointermove=e=>{if(sx===undefined)return;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>5)moved=true;if(moved){px=ox+dx;py=oy+dy;b.style.translate=`${px}px ${py}px`}};b.onpointerup=()=>{sx=undefined;if(moved){suppress=true;setTimeout(()=>suppress=false,0)}};b.onclick=()=>{if(suppress)return;flipped.has(i)?flipped.delete(i):flipped.add(i);drawUI()};slots.append(b)});instruction.textContent=drawn.length<count?`請從下方選擇第 ${drawn.length+1} 張牌（共 ${count} 張）`:'牌已抽好：拖動牌可調整位置，點擊翻面。';copy.disabled=drawn.length<count;deck.querySelectorAll('button').forEach(b=>b.disabled=drawn.length>=count||b.dataset.used==='yes')}
document.querySelector('#start').onclick=()=>{if(!topic&&!question.value.trim()){result.textContent='請選擇方向或輸入問題。';reading.hidden=false;deck.innerHTML='';slots.innerHTML='';instruction.textContent='';return}result.textContent='';drawn=[];flipped=new Set();reading.hidden=false;deck.innerHTML='';for(let i=0;i<11;i++){let b=document.createElement('button');b.setAttribute('aria-label',`抽取第 ${i+1} 張示意牌`);b.textContent='✦';b.style.setProperty('--x',`${(i-5)*44}px`);b.style.setProperty('--r',`${(i-5)*3}deg`);b.onclick=()=>{if(drawn.length>=count)return;b.dataset.used='yes';let available=samples.filter(v=>!drawn.includes(v));drawn.push(available[Math.floor(Math.random()*available.length)]);drawUI()};deck.append(b)}drawUI()};document.querySelector('#reset').onclick=()=>{reading.hidden=true;drawn=[];flipped=new Set();result.textContent=''};copy.onclick=async()=>{const labels=count===1?['你的牌']:['過去','現在','未來'];let text=`請以娛樂和自我探索的角度解讀以下塔羅占卜。\n方向：${topic||'未指定'}\n問題：${question.value.trim()||'請針對選擇的方向給予解讀'}\n`+drawn.map((v,i)=>`${labels[i]}：${v[0]}（${v[1]}）`).join('\n');try{await navigator.clipboard.writeText(text);result.textContent='已複製示意占卜內容。'}catch{result.textContent='請以本機伺服器開啟此頁後複製。'}};
</script></body></html>
